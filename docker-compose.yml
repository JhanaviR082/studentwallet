services:
  cassandra:
    image: cassandra:4.1
    container_name: student-wallet-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=StudentWalletCluster
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./backend/src/main/resources/schema.cql:/docker-entrypoint-initdb.d/schema.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  cassandra_data:
