<div class="auth-page">
  <div class="auth-card">
    <mat-icon class="auth-icon">account_balance_wallet</mat-icon>
    <h1>Welcome back</h1>
    <p>Sign in to your private wallet</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button mat-flat-button class="submit-btn" type="submit" [disabled]="form.invalid || loading">
        Sign In
      </button>
    </form>

    <p class="switch">No account? <a routerLink="/register">Create one</a></p>
  </div>
</div>
